type: charm

parts:
  charm:
    plugin: reactive
    build-packages:
      - tox
      - git
      - python3-dev
    source: src/
    build-snaps:
      - charm/3.x/stable
    build-environment:
      - CHARM_INTERFACES_DIR: $CRAFT_PROJECT_DIR/interfaces/
      - CHARM_LAYERS_DIR: $CRAFT_PROJECT_DIR/layers/
    reactive-charm-build-arguments:
      - --use-lock-file-branches
platforms:
  ubuntu@22.04:amd64:
  ubuntu@22.04:arm64:
  ubuntu@22.04:ppc64el:
  ubuntu@22.04:s390x:
  ubuntu@24.04:amd64:
  ubuntu@24.04:arm64:
  ubuntu@24.04:ppc64el:
  ubuntu@24.04:s390x:
